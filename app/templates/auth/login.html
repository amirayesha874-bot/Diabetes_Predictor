{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}<div class="card auth-box"><h1>Welcome back</h1><p class="muted">Log in to your account.</p>
<form method="post" novalidate>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required autofocus></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Your password" required></div>
<button class="btn block">Log in</button></form>
<p class="small center" style="margin-top:1rem"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a> · <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>{% endblock %}
